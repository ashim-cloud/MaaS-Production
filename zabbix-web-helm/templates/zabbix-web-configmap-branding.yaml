{{/*
=============================================================================
Zabbix Web — Precision Logo ConfigMap
=============================================================================
Contains Precision SVG logos, favicon and Zabbix 8 brand configuration.
Native Zabbix CSS remains untouched.
*/}}

{{- if .Values.branding.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.branding.configMapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-web.labels" . | nindent 4 }}
    app: zabbix-web
data:
  precision-full-logo.svg: |
{{ .Files.Get "files/branding/precision-full-logo.svg" | indent 4 }}

  precision-sidebar-logo.svg: |
{{ .Files.Get "files/branding/precision-sidebar-logo.svg" | indent 4 }}

  precision-compact-logo.svg: |
{{ .Files.Get "files/branding/precision-compact-logo.svg" | indent 4 }}

  brand.conf.php: |
    <?php
    return [
        'BRAND_LOGO' => '/assets/precision-full-logo.svg',
        'BRAND_LOGO_SIDEBAR' => '/assets/precision-sidebar-logo.svg',
        'BRAND_LOGO_SIDEBAR_COMPACT' => '/assets/precision-compact-logo.svg'
    ];

binaryData:
  precision-favicon.ico: {{ .Files.Get "files/branding/precision-favicon.ico" | b64enc | quote }}
{{- end }}
