{{/*
=============================================================================
Zabbix Web — Deployment
=============================================================================
Faithful conversion of the original zabbix-web-deploy.yaml Deployment.

ZBX_SERVER_HOST points to the Zabbix Server service name (configurable via
zabbixServer.serviceName), which within the cluster resolves via ClusterIP.

Secrets method: AWS SSM Parameter Store + EKS Pod Identity
  An initContainer (ssm-init) fetches all DB parameters under db.ssm.path
  at pod startup and writes each to an in-memory volume (emptyDir: medium:
  Memory). The zabbix-web container reads them from /secrets/* via a shell
  command before exec-ing docker-entrypoint.

  Fail-fast behaviour:
    - ssm-init exits non-zero if the AWS call fails (no creds, AccessDenied,
      wrong path/region) or if any required parameter is missing/empty.
      The pod then shows Init:Error with the real AWS error in the init log.
    - zabbix-web re-checks the files before starting, so it can never silently
      fall back to the Unix socket / default port 5432.
  Nothing is persisted to etcd or EC2 disk (the parameters are held in a shell
  variable and written only to the Memory-backed emptyDir).
*/}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zabbix-web.deploymentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zabbix-web.labels" . | nindent 4 }}
    app: zabbix-web
spec:
  {{- if not .Values.zabbixWeb.autoscaling.enabled }}
  replicas: {{ .Values.zabbixWeb.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        {{- include "zabbix-web.labels" . | nindent 8 }}
        app: zabbix-web
    spec:
      serviceAccountName: {{ include "zabbix-web.serviceAccountName" . }}

      # ---- In-memory volume — secrets written here by the initContainer ------
      volumes:
        - name: secrets-vol
          emptyDir:
            medium: Memory
        {{- if .Values.branding.enabled }}
        - name: precision-zabbix-logos
          configMap:
            name: {{ .Values.branding.configMapName }}
        - name: precision-zabbix-dark-theme
          configMap:
            name: {{ .Values.branding.configMapName }}-dark-theme
        - name: precision-zabbix-hc-light
          configMap:
            name: {{ .Values.branding.configMapName }}-hc-light
        - name: precision-zabbix-hc-dark
          configMap:
            name: {{ .Values.branding.configMapName }}-hc-dark
        {{- end }}

      # ---- initContainer: pull SSM parameters before zabbix-web starts -------
      initContainers:
        - name: ssm-init
          # Pin a version via db.ssm.image in values.yaml (e.g. ...aws-cli:2.x.y)
          image: {{ .Values.db.ssm.image | default "public.ecr.aws/aws-cli/aws-cli:latest" | quote }}
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.db.ssm.region | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              SSM_PATH={{ .Values.db.ssm.path | quote }}
              TAB="$(printf '\t')"

              # Plain assignment (no pipe): with `set -e`, any aws failure
              # (credentials, AccessDenied, wrong region) stops the script here
              # and the real error is printed to the init container log.
              PARAMS="$(aws ssm get-parameters-by-path \
                --path "$SSM_PATH" \
                --with-decryption \
                --recursive \
                --query 'Parameters[*].[Name,Value]' \
                --output text)"

              printf '%s\n' "$PARAMS" | while IFS="$TAB" read -r name value; do
                [ -n "$name" ] || continue
                printf '%s' "$value" > "/secrets/$(basename "$name")"
              done

              # Validate: every required parameter must exist and be non-empty
              for f in host port user password dbname; do
                if [ ! -s "/secrets/$f" ]; then
                  echo "ssm-init: ERROR missing or empty /secrets/$f (path: $SSM_PATH, region: $AWS_DEFAULT_REGION)" >&2
                  echo "ssm-init: files present: $(ls /secrets | tr '\n' ' ')" >&2
                  exit 1
                fi
              done

              echo "ssm-init: wrote $(ls /secrets | wc -l) secret(s) from $SSM_PATH"
          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets

      containers:
        - name: zabbix-web
          image: {{ include "zabbix-web.image" . }}

          # ---- DB credentials sourced from in-memory /secrets/* --------------
          # Verifies every secret file exists, exports the env vars, then
          # exec-replaces itself with docker-entrypoint so PID 1 is the real
          # entrypoint (correct signal handling, no shell wrapper overhead).
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # Refuse to start without DB settings (prevents silent fallback
              # to the Unix socket / default port 5432)
              for f in host port user password dbname; do
                if [ ! -s "/secrets/$f" ]; then
                  echo "zabbix-web: ERROR missing /secrets/$f - ssm-init did not populate it" >&2
                  exit 1
                fi
              done

              # Load database credentials from in-memory secrets
              export DB_SERVER_HOST="$(cat /secrets/host)"
              export DB_SERVER_PORT="$(cat /secrets/port)"
              export POSTGRES_USER="$(cat /secrets/user)"
              export POSTGRES_PASSWORD="$(cat /secrets/password)"
              export POSTGRES_DB="$(cat /secrets/dbname)"

              # Require SSL/TLS for PostgreSQL connections
              export PGSSLMODE=require

              echo "DB target: ${DB_SERVER_HOST}:${DB_SERVER_PORT} (db=${POSTGRES_DB}, user=${POSTGRES_USER})"
              echo "PostgreSQL SSL mode: $PGSSLMODE"

              # Start the original Zabbix Web entrypoint
              exec /usr/bin/docker-entrypoint

          env:
            # Require encrypted PostgreSQL connections
            - name: PGSSLMODE
              value: "require"
            # Enable Zabbix frontend PostgreSQL TLS
            - name: ZBX_DB_ENCRYPTION
              value: "true"
            - name: ZBX_SERVER_HOST
              value: {{ include "zabbix-web.serverServiceName" . | quote }}
            - name: PHP_TZ
              value: {{ .Values.zabbixWeb.phpTz | quote }}
            - name: ZBX_SERVER_NAME
              value: "Prestack Monitoring"

          ports:
            - containerPort: {{ .Values.zabbixWeb.service.targetPort }}

          volumeMounts:
            - name: secrets-vol
              mountPath: /secrets
              readOnly: true
            {{- if .Values.branding.enabled }}
            - mountPath: /usr/share/zabbix/assets/styles/blue-theme.css
              name: precision-zabbix-logos
              readOnly: true
              subPath: blue-theme.css
            - mountPath: /usr/share/zabbix/assets/styles/dark-theme.css
              name: precision-zabbix-dark-theme
              readOnly: true
              subPath: dark-theme.css
            - mountPath: /usr/share/zabbix/assets/styles/hc-light.css
              name: precision-zabbix-hc-light
              readOnly: true
              subPath: hc-light.css
            - mountPath: /usr/share/zabbix/assets/styles/hc-dark.css
              name: precision-zabbix-hc-dark
              readOnly: true
              subPath: hc-dark.css
            - mountPath: /usr/share/zabbix/assets/precision-full-logo.svg
              name: precision-zabbix-logos
              readOnly: true
              subPath: precision-full-logo.svg
            - mountPath: /usr/share/zabbix/assets/precision-sidebar-logo.svg
              name: precision-zabbix-logos
              readOnly: true
              subPath: precision-sidebar-logo.svg
            - mountPath: /usr/share/zabbix/assets/precision-compact-logo.svg
              name: precision-zabbix-logos
              readOnly: true
              subPath: precision-compact-logo.svg
            - mountPath: /usr/share/zabbix/favicon.ico
              name: precision-zabbix-logos
              readOnly: true
              subPath: favicon.ico
            {{- end }}

          resources:
            requests:
              cpu: {{ .Values.zabbixWeb.resources.requests.cpu }}
              memory: {{ .Values.zabbixWeb.resources.requests.memory }}
            limits:
              cpu: {{ .Values.zabbixWeb.resources.limits.cpu }}
              memory: {{ .Values.zabbixWeb.resources.limits.memory }}
